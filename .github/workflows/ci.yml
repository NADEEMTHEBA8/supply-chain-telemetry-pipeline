name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java Development Kit (Required for PySpark JVM initialization)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Validate config module imports
        run: |
          python -c "from src.common.settings import settings; print('AppSettings OK — stream:', settings.kinesis_stream_name)"
          python -c "from src.common.logger import configure_logging; print('logger OK')"

      - name: Run tests
        run: pytest -v --tb=short

  infra-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose (standalone)
        run: |
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Create env file from example
        run: cp .env.example .env.local

      - name: Validate docker-compose.yml syntax
        run: docker-compose --env-file .env.local config --quiet

      - name: Assert all REQUIRED_VARS are present in .env.example
        run: |
          REQUIRED_VARS=(
            POSTGRES_PASSWORD
            KINESIS_STREAM_NAME
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_DEFAULT_REGION
            PG_PASSWORD
          )
          MISSING=""
          for var in "${REQUIRED_VARS[@]}"; do
            if ! grep -q "^${var}=" .env.example; then
              MISSING="${MISSING} ${var}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: Missing required vars in .env.example:${MISSING}"
            exit 1
          fi
          echo "All required vars present in .env.example"

      - name: Assert .env.local is gitignored
        run: |
          if git check-ignore -q .env.local; then
            echo ".env.local is correctly gitignored"
          else
            echo "ERROR: .env.local is NOT gitignored — secrets would be committed!"
            exit 1
          fi

      - name: Validate Terraform formatting
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"
      - run: |
          cd terraform
          terraform fmt -check
