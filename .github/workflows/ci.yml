name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── Lint + Unit Tests ─────────────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project with all dev extras — pinned in pyproject.toml.
          # This pulls pydantic-settings, python-json-logger, etc.
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Validate config module imports
        # Ensures pydantic-settings is installed and AppSettings loads without error
        run: |
          python -c "from config.settings import settings; print('AppSettings OK:', settings.kafka_topic_raw)"
          python -c "from config.logging_config import configure_logging; print('logging_config OK')"

      - name: Run tests
        run: pytest -v --tb=short

  # ─── Infrastructure Validation ─────────────────────────────────────────────
  infra-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose (standalone)
        run: |
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Create env file from example
        # Use the committed template — never real secrets in CI.
        run: cp .env.local.example .env.local

      - name: Validate docker-compose.yml syntax
        # docker compose config exits non-zero if the file has any errors.
        # --quiet suppresses the full interpolated config output.
        run: docker-compose --env-file .env.local config --quiet

      - name: Assert all REQUIRED_VARS are present in .env.local.example
        # Guard: if a developer adds a new required var to settings.py but
        # forgets to add it to .env.local.example, CI fails before the next
        # on-call engineer is paged at 3 AM.
        run: |
          REQUIRED_VARS=(
            POSTGRES_PASSWORD
            MINIO_ACCESS_KEY
            MINIO_SECRET_KEY
            KAFKA_BOOTSTRAP_SERVERS
            REDIS_HOST
            PG_PASSWORD
            API_KEY
          )
          MISSING=""
          for var in "${REQUIRED_VARS[@]}"; do
            if ! grep -q "^${var}=" .env.local.example; then
              MISSING="${MISSING} ${var}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: Missing required vars in .env.local.example:${MISSING}"
            exit 1
          fi
          echo "All required vars present in .env.local.example"

      - name: Assert .env.local is gitignored
        run: |
          if git check-ignore -q .env.local; then
            echo ".env.local is correctly gitignored"
          else
            echo "ERROR: .env.local is NOT gitignored — secrets would be committed!"
            exit 1
          fi
