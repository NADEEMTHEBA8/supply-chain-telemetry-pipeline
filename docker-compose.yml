# ─── Predictive Supply Chain Telemetry Pipeline — Docker Compose ──────────────
#
# Architecture: Local Digital Twin of the AWS + Databricks production stack
# Network:      supply_chain_vpc — isolated bridge network
#
# Dev/Prod Parity mapping:
#   postgres      → AWS RDS / ERP database (CDC source for AWS DMS)
#   kafka-connect → Debezium CDC connector (production: AWS DMS)
#
# Note: Databricks and AWS S3/Kinesis are REAL cloud services — not simulated here.
#       Only the ERP PostgreSQL source and Debezium CDC run locally.
#
# Config:   All secrets injected from .env.local (gitignored)
#           See .env.example for the full variable manifest.
#
# Usage:
#   cp .env.example .env.local
#   make cluster-up
# ─────────────────────────────────────────────────────────────────────────────

name: supply-chain-pipeline

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  supply_chain_vpc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:

services:

  # ── PostgreSQL — ERP Reference Data Source ────────────────────────────────
  # Simulates TE Connectivity's ERP system (SAP, Oracle, etc.)
  # Contains: machines, suppliers, inventory_levels tables
  # CDC: Debezium tails the WAL — events flow to Kafka topics
  # Production equivalent: AWS DMS replicates this directly to S3
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks:
      - supply_chain_vpc
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: supply_chain_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: supply_chain_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supply_chain_admin -d supply_chain_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka (KRaft — no Zookeeper) ──────────────────────────────────────────
  # Internal broker for Debezium CDC events.
  # Production equivalent: Amazon MSK
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: kafka
    networks:
      - supply_chain_vpc
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CLUSTER_ID: supply-chain-kafka-cluster
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Debezium (Kafka Connect) — CDC Connector ───────────────────────────────
  # Tails PostgreSQL WAL → publishes supply_chain_cdc.public.machines etc.
  # Production equivalent: AWS DMS replicates directly to S3
  kafka-connect:
    image: debezium/connect:2.5
    container_name: kafka-connect
    networks:
      - supply_chain_vpc
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: supply-chain-connect-cluster
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
