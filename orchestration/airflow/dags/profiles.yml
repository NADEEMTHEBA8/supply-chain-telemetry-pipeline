# dbt connection profiles for the Supply Chain Warehouse
#
# Used by: dbt CLI, Airflow dbt operators, and Databricks dbt integration
# Target: supply_chain_db PostgreSQL (local ERP reference data)
#         In production, dbt-databricks targets the Databricks SQL Warehouse directly.

supply_chain_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      port: "{{ env_var('PG_PORT', '5432') | int }}"
      user: "{{ env_var('PG_USER', 'supply_chain_admin') }}"
      password: "{{ env_var('PG_PASSWORD', 'changeme_local_only') }}"
      dbname: "{{ env_var('PG_DATABASE', 'supply_chain_db') }}"
      schema: silver
      threads: 4
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      schema: gold
      threads: 8
