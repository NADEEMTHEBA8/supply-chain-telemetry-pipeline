# dbt profile for the Airflow container — 12-Factor III compliant.
#
# Inside the fraud_vpc Docker network, Postgres is reachable at:
#   host: postgres (Docker DNS)   port: 5432
#
# These values are injected by docker-compose.yml as environment variables
# into the airflow container, so this profiles.yml reads them identically
# to how it would in Cloud Composer or MWAA.
#
# This file is mounted at /opt/airflow/dags/profiles.yml inside the container.
# The DAG references it via DBT_PROFILES_DIR=/opt/airflow/dags.

fraud_warehouse:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'postgres') }}"
      port: "{{ env_var('PG_PORT', '5432') | int }}"
      user: "{{ env_var('PG_USER', 'fraud_admin') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      dbname: "{{ env_var('PG_DATABASE', 'fraud_reference') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'silver') }}"
      threads: "{{ env_var('DBT_THREADS', '2') | int }}"
