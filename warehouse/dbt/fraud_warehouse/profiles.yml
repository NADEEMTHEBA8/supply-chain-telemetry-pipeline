# dbt connection profile — 12-Factor III compliant.
#
# ALL values are injected from environment variables via dbt's env_var()
# function. No credentials, hostnames, or port numbers are hardcoded.
#
# Local (.env.local):  PG_HOST=127.0.0.1  PG_PORT=5434
# Airflow container:   PG_HOST=postgres    PG_PORT=5432  (Docker DNS)
# GCP production:      PG_HOST=<Cloud SQL private IP>
#
# This single profiles.yml is identical across all environments.
# Migration = swapping the env file. No code change required.
#
# Cloud Composer equivalent:
#   Set these as Airflow environment variables in the Composer 2 config.
# AWS MWAA equivalent:
#   Set these in the MWAA Environment → Environment Variables.

fraud_warehouse:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      port: "{{ env_var('PG_PORT', '5434') | int }}"
      user: "{{ env_var('PG_USER', 'fraud_admin') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      dbname: "{{ env_var('PG_DATABASE', 'fraud_reference') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'silver') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
