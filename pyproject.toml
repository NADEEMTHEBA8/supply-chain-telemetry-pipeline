[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-telemetry-pipeline"
version = "0.1.0"
description = "Predictive Supply Chain Telemetry Pipeline on AWS S3 & Databricks"
authors = [
    {name = "Nadeem Theba", email = "nadeemtheba8@gmail.com"}
]
requires-python = ">=3.11,<3.12"

dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "faker>=24.0.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "pyspark>=3.5.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "python-json-logger>=2.0.7",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "ingestion*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "B905", "N812"]

[tool.pytest.ini_options]
testpaths = ["tests", "ingestion"]
python_files = "test_*.py"
pythonpath = "."

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
