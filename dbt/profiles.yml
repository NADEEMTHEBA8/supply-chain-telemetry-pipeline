supply_chain_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', '127.0.0.1') }}"
      port: "{{ env_var('PG_PORT', '5432') | int }}"
      user: "{{ env_var('PG_USER', 'supply_chain_admin') }}"
      password: "{{ env_var('PG_PASSWORD', 'changeme_local_only') }}"
      dbname: "{{ env_var('PG_DATABASE', 'supply_chain_db') }}"
      schema: public
      threads: 4
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      schema: gold
      threads: 8
